# Rust toolchain pin. Without it, clippy's MSRV-aware lints flip between
# machines: a newer toolchain proposes APIs that the declared MSRV rejects,
# so the same code is clean locally and red in CI. The shared checkers read
# rustdoc JSON of the format this toolchain writes.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
