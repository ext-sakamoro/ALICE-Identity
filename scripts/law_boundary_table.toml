[[function]]
file = "src/artifact.rs"
name = "law_ref"
class = "signed artifact"
reason = "the law reference bytes of a signed artifact, given back only by open after the signature over them verified; the caller parses them (LawRef::from_bytes checks the law identifier)"

[[function]]
file = "src/artifact.rs"
