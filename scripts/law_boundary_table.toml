reason = "an Ed25519 signature by the device key over the context and a payload digest"

[[function]]
file = "src/artifact.rs"
name = "signature"
class = "signature"
reason = "the 64 bytes of the Ed25519 signature"

[[function]]
file = "src/artifact.rs"
