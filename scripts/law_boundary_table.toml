# ALICE-Law G7 / G8 / G9 scope: every public function whose signature takes or returns
# bytes, keyed by file and name, with its class and why no Law-bearing value crosses it
# (scripts/law_boundary_scan.py)

[[function]]
file = "src/artifact.rs"
name = "bytes"
class = "digest"
reason = "the 32 bytes of a payload's SHA-256 digest"

[[function]]
file = "src/artifact.rs"
name = "context"
class = "label"
reason = "the printable context label an artifact signature is bound to"

[[function]]
file = "src/artifact.rs"
