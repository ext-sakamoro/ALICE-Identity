name = "sha256"
class = "digest"
reason = "a payload digest made from 32 SHA-256 bytes the caller computed"

[[function]]
file = "src/artifact.rs"
name = "sha256_payload"
class = "digest"
reason = "the SHA-256 of the caller's payload bytes"

[[function]]
