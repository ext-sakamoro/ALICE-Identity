# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier list that must keep the released value, and the
# release tags the base is read from (its values come from the published crate)
package = "alice-identity"
manifest = "Cargo.toml"
tags = ["v{version}", "alice-identity-v{version}"]

[[id]]
path = "alice_identity::semantics::IDENTITY_SEMANTICS_ID"

[exempt]
RFC4648 = "the RFC 4648 base32 alphabet (32 characters), a fixed table of the text format, not a content identifier"
CROCKFORD = "Crockford's base32 alphabet (32 characters) for short codes, a fixed table, not a content identifier"
