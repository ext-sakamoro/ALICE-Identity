name: CI

on:
  push:
    # ci/** runs the whole workflow on a branch before it is landed on main
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  msrv:
    name: MSRV (rust-version 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      # `cargo +1.88`: rust-toolchain.toml would otherwise select the pinned toolchain for plain `cargo`
      - name: Check on the declared rust-version
        run: |
          v=$(cargo +1.88 --version)
          case "$v" in "cargo 1.88."*) ;; *) echo "::error::not cargo 1.88: $v"; exit 1 ;; esac
          cargo +1.88 check --all-features

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check


  test:
    name: Test, clippy and doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      # every test target must run and pass; a run that passes no test fails (it compared nothing)
      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log
          passed=$(grep -E '^test result: ' test.log | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed}"
          if [ "${passed}" -eq 0 ]; then echo "::error::no test passed"; exit 1; fi
      - name: Doc (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
