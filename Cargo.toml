[package]
name = "alice-identity"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false
description = "Decentralized identity (DID) — self-sovereign identity as DAG trust graphs, W3C DID Core + Ed25519Signature2020"
repository = "https://github.com/ext-sakamoro/ALICE-Identity"
authors = ["Moroya Sakamoto"]

[dependencies]
# Ed25519, SHA-256 and the signed credential with its selective disclosure (feature cred) come from
# alice-sign (LicenseRef-Proprietary), taken by git at a full commit until it is published; the git
# and rev keys go away then
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "bb79209e376ec3989bf721f48d5894032a221e8b", features = ["cred"] }
