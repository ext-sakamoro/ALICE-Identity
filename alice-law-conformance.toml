# ALICE-Law conformance manifest for this crate (alice-identity). One entry per gate defined in
# ALICE-Law's conformance/gates.toml; the schema (status / evidence / since / note / reference_repo) is
# the "Manifest" section of docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit this file is added on:
# the library and test suites were run (debug and release), clippy was run with the crate's own
# configuration, and every `pass` carries a measured mutant (each reverted). `n/a` (G7 to G9) is
# measured by scripts/law_boundary_scan.py; `fail-known` names what is missing. The crate has no
# cargo features and no floating-point arithmetic: DIDs, credentials, device certificates,
# artifact signatures and the trust graph are strings, bytes and Ed25519 / SHA-256 from alice-sign.

